name: Android Master CI
on:
  push:
    branches:
      - master
      - 'fix/**'
jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/key.jks
          else
            # fork 没有签名 secrets 时，生成临时 keystore 以便产出可安装的调试包
            keytool -genkeypair -keystore /tmp/key.jks -storepass android -keypass android \
              -alias ci -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=CI"
          fi
      - name: Build with Gradle
        env:
          SIGN_KEY_STORE_FILE: "/tmp/key.jks"
          SIGN_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          SIGN_KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ci' }}
          SIGN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurboIMS-CI
          path: app/build/outputs/apk/debug/app-debug.apk
