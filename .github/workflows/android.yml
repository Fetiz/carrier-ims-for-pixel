name: Android CI
on:
  workflow_dispatch:
  push:
    branches:
      - release
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/key.jks
        else
          # fork 没有签名 secrets 时，生成临时 keystore 以便产出可安装的发布包
          keytool -genkeypair -keystore /tmp/key.jks -storepass android -keypass android \
            -alias ci -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=CI"
        fi
    - name: Build with Gradle
      env:
        SIGN_KEY_STORE_FILE: "/tmp/key.jks"
        SIGN_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
        SIGN_KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ci' }}
        SIGN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
      run: |
        ./gradlew assembleRelease
    - name: Install jq
      run: sudo apt-get install jq
    - name: Parse build files
      id: apk
      run: |
        versionName=$(cat "app/build/outputs/apk/release/output-metadata.json" | jq -r '.elements[0].versionName')
        versionCode=$(cat "app/build/outputs/apk/release/output-metadata.json" | jq -r '.elements[0].versionCode')
        mkdir outputs
        mv "app/build/outputs/apk/release/app-release.apk" "outputs/CarrierIMSForPixel.apk"
        echo "versionName=$versionName" >> $GITHUB_OUTPUT
        echo "versionCode=$versionCode" >> $GITHUB_OUTPUT
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.apk.outputs.versionName }}
        body_path: CHANGELOG.md
        files: |
          outputs/CarrierIMSForPixel.apk
